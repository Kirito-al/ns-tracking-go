# Go-Zero REST API 服务配置（开发环境）
Name: tracking-api-dev
Host: 0.0.0.0
Port: 8081

# ===================== gRPC Client 配置 =====================
TrackingRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: tracking.rpc
  Timeout: 5000

# ===================== Redis 配置 =====================
Redis:
  Host: localhost:6379
  Type: node
  Pass: ""              # 开发环境可不设密码
  Db: 0

# ===================== 安全配置 =====================
YunExpressWebhookSecret: "dev-secret-key"
GEYunExpressWebhookSecret: "dev-ge-secret-key"
YunExpressSkipSignature: true  # 开发环境跳过验证

# ===================== CORS配置 =====================
CORS:
  AllowedOrigins:
    - "*"               # 开发环境允许所有来源
  AllowedMethods:
    - GET
    - POST
    - PUT
    - DELETE
  AllowedHeaders:
    - Content-Type
    - Authorization

# ===================== 日志配置 =====================
Log:
  ServiceName: tracking-api-dev
  Mode: console
  Encoding: json
  Level: debug          # 开发环境debug级别
  Path: logs/tracking-api-dev.log

# ===================== 限流熔断配置 =====================
MaxConns: 1000
Timeout: 30000          # 开发环境30秒超时
CpuThreshold: 900

Breaker:
  Enabled: false        # 开发环境不启用熔断