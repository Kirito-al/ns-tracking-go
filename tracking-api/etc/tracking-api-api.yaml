# Go-Zero REST API 服务配置（开发环境）
Name: tracking-api
Host: 0.0.0.0
Port: 8082  # 改成 8082 端口

# ===================== gRPC Client =====================
# 开发环境：直连 gRPC 服务
TrackingRpc:
  Target: 127.0.0.1:50051

# 生产环境：使用 Consul 服务发现
# TrackingRpc:
#   Consul:
#     Host: 127.0.0.1:8500
#     Key: tracking.rpc

# ===================== Redis =====================
RedisConf:
  Host: localhost:6379
  Pass: ""
  Db: 0

# ===================== 安全配置 =====================
YunExpressWebhookSecret: test-secret
GEYunExpressWebhookSecret: test-ge-secret
YunExpressSkipSignature: true  # 开发环境跳过验证

# ===================== CORS =====================
CORS:
  AllowedOrigins:
    - "*"
  AllowedMethods:
    - GET
    - POST
    - PUT
    - DELETE
  AllowedHeaders:
    - Content-Type
    - Authorization

# ===================== 限流 =====================
MaxConns: 1000           # 最大并发连接数（限流保护）
Timeout: 5000            # HTTP 请求超时（优化：从 30 秒降为 5 秒）
CpuThreshold: 900