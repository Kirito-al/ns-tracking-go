# Go-Zero REST API 服务配置（生产环境）
Name: tracking-api
Host: 0.0.0.0
Port: 8081

# ===================== gRPC Client 配置 =====================
TrackingRpc:
  Consul:
    Host: "${CONSUL_HOST}"
    Scheme: http
    Key: tracking.rpc
  # 优雅超时配置
  Timeout: 5000              # 5秒超时
  KeepAlive: 10s             # 保活时间
  MaxRecvMsgSize: 10485760   # 最大接收消息 10MB
  MaxSendMsgSize: 10485760   # 最大发送消息 10MB

# ===================== Redis 配置 =====================
Redis:
  Host: "${REDIS_HOST}"
  Type: node
  Pass: "${REDIS_PASSWORD}"  # 生产环境必须设置密码
  Db: 0
  MaxIdle: 100
  MaxActive: 200
  IdleTimeout: 300s

# ===================== 安全配置 =====================
# 生产环境必须验证签名
YunExpressWebhookSecret: "${YUN_EXPRESS_WEBHOOK_SECRET}"
GEYunExpressWebhookSecret: "${GE_YUN_EXPRESS_WEBHOOK_SECRET}"
YunExpressSkipSignature: false  # 生产环境必须验证！

# CORS 配置（生产环境指定域名）
CORS:
  AllowedOrigins:
    - "https://admin.yourcompany.com"
    - "https://tracking.yourcompany.com"
  AllowedMethods:
    - GET
    - POST
    - PUT
    - DELETE
  AllowedHeaders:
    - Content-Type
    - Authorization
    - X-Request-ID
  AllowCredentials: true

# ===================== 限流配置 =====================
# go-zero 内置限流
RateLimit:
  Enabled: true
  Concurrency: 1000     # 最大并发
  QPS: 10000            # 每秒请求数

# ===================== 监控配置 =====================
Prometheus:
  Host: 0.0.0.0
  Port: 9091
  Path: /metrics

# ===================== 日志配置 =====================
Log:
  ServiceName: tracking-api
  Mode: console
  Encoding: json
  Level: info
  Path: logs/tracking-api.log
  KeepDays: 7
  Compress: true

# ===================== 超时配置 =====================
Timeout: 10000            # 全局超时 10s
MaxConns: 1000           # 最大连接
MaxBytes: 10485760       # 最大请求体 10MB