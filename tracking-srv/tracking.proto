syntax = "proto3";

package tracking;

option go_package = "tracking-srv/tracking";

// UpsertRequest 插入或更新追踪数据请求
message UpsertRequest {
    string tracking_number = 1;
    string detail = 2;
    int32 status = 3;
    string service_class = 4;
    int64 synced_at = 5;
}

// UpsertResponse 插入或更新响应
message UpsertResponse {
    bool success = 1;
    string message = 2;
}

// GetTrackingRequest 获取追踪数据请求
message GetTrackingRequest {
    string tracking_number = 1;
}

// GetTrackingResponse 获取追踪数据响应
message GetTrackingResponse {
    string tracking_number = 1;
    string detail = 2;
    int32 status = 3;
    string service_class = 4;
    int64 synced_at = 5;
    string error_message = 6;
}

// MarkErrorRequest 标记错误请求
message MarkErrorRequest {
    string tracking_number = 1;
    string error_message = 2;
}

// MarkErrorResponse 标记错误响应
message MarkErrorResponse {
    bool success = 1;
    string message = 2;
}

service TrackingService {
    rpc UpsertTracking(UpsertRequest) returns (UpsertResponse);
    rpc GetTracking(GetTrackingRequest) returns (GetTrackingResponse);
    rpc MarkError(MarkErrorRequest) returns (MarkErrorResponse);
}