# Go-Zero RPC 服务配置（开发环境）
Name: tracking.rpc
ListenOn: 127.0.0.1:50051

# ===================== 数据库配置 =====================
DataSource: postgres://postgres:123456@127.0.0.1:5432/ns_admin_webhook_development?sslmode=disable

# 数据库连接池配置（优化：避免连接耗尽）
DatabaseConfig:
  MaxOpenConns: 100        # 最大打开连接数
  MaxIdleConns: 25         # 最大空闲连接数
  ConnMaxLifetime: 300     # 连接最大生命周期（秒，5分钟）
  ConnMaxIdleTime: 60      # 空闲连接最大存活时间（秒，1分钟）

# ===================== Redis 配置 =====================
RedisConf:
  Host: localhost:6379
  Pass: ""
  Db: 0

# ===================== Asynq 队列配置（Db=1，与缓存隔离）=====================
AsynqRedisConf:
  Addr: localhost:6379
  Password: ""
  DB: 1                # Redis DB=1，与缓存隔离
  Concurrency: 10      # Worker 并发数

# ===================== 服务发现（Consul）=====================
# 生产环境：注册到 Consul，带 UI 界面
# Consul:
#   Host: 127.0.0.1:8500
#   Key: tracking.rpc
#   Meta:
#     service: tracking-srv
#     version: 1.0.0

# 开发环境：直接监听（不注册 Consul）
# 如需启用 Consul，取消上面注释即可